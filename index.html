<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREET MAIL ✉️</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,700;1,800&family=Permanent+Marker&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#e4e1da;--wall:#d3cfc6;--card:#fffdf4;--ink:#16161a;--mute:#6b6760;--y:#ffe500;--p:#ff2e88;--g:#00d68f;--kraft:#d8b184;--kraft2:#c49a6c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171b;--wall:#232328;--card:#2b2b31;--ink:#f4f1e8;--mute:#9d9a92}}
:root[data-theme="dark"]{--bg:#17171b;--wall:#232328;--card:#2b2b31;--ink:#f4f1e8;--mute:#9d9a92}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kanit","Sarabun",system-ui,sans-serif;line-height:1.5;
background-image:radial-gradient(var(--wall) 1.5px,transparent 1.5px);background-size:18px 18px}
main{max-width:680px;margin:0 auto;padding:18px 16px 70px}
h1{font-family:"Permanent Marker","Kanit",cursive;font-size:38px;margin:6px 0 0;transform:rotate(-2deg);color:var(--ink);text-shadow:3px 3px 0 var(--y)}
.sub{margin:6px 0 18px;color:var(--mute);font-size:14px}
h2{display:inline-block;font-size:15px;font-weight:700;background:var(--ink);color:var(--bg);padding:3px 12px;margin:26px 0 12px;transform:rotate(-1deg);letter-spacing:.5px}
.box{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;position:relative}
.box::before{content:"";position:absolute;top:-12px;left:20px;width:70px;height:22px;background:rgba(255,229,0,.8);transform:rotate(-4deg)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:0;padding:9px 11px;margin-bottom:8px}
textarea{min-height:120px;resize:vertical}
.lab{font-size:13px;font-weight:700;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:5px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--y);color:#16161a}
button{font:inherit;font-weight:700;cursor:pointer;border:3px solid var(--ink);background:var(--p);color:#fff;padding:9px 20px;box-shadow:4px 4px 0 var(--ink);text-transform:uppercase}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.45}
.chip{text-transform:none;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.env{position:relative;height:108px;background:var(--kraft);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:0;width:100%;text-transform:none;color:var(--ink)}
.env:nth-child(odd){transform:rotate(-2.5deg)}.env:nth-child(even){transform:rotate(2deg)}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:60px;background:var(--kraft2);clip-path:polygon(0 0,100% 0,50% 100%)}
.env .tape{position:absolute;top:-10px;left:50%;width:46px;height:18px;background:rgba(255,229,0,.85);transform:translateX(-50%) rotate(5deg)}
.env .seal{position:absolute;left:50%;top:38px;transform:translateX(-50%) rotate(-8deg);background:var(--y);border:2px solid var(--ink);padding:0 8px;font-size:13px;white-space:nowrap;color:#16161a}
.env .nm{position:absolute;bottom:6px;left:0;right:0;font-size:12px;font-weight:700;text-align:center}
.env.read{opacity:.6}
.env.new::after{content:"NEW";position:absolute;top:-12px;right:-8px;background:var(--p);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border:2px solid var(--ink);transform:rotate(8deg)}
.mine{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:2px dashed var(--mute);font-size:14px}
.mine:last-child{border:0}
.mine span:last-child{white-space:nowrap;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:14px;font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
#modal{position:fixed;inset:0;background:rgba(10,10,14,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;overflow:auto}
#modal.on{display:flex}
.wrap{position:relative;width:min(340px,100%)}
.mis{background:var(--y);color:#16161a;border:3px solid #16161a;box-shadow:6px 6px 0 var(--p);padding:16px;text-align:center}
.mis h3{margin:0 0 4px;font-family:"Permanent Marker","Kanit";font-size:22px}
.mis p{margin:4px 0 12px}
.mis button{background:#16161a;color:var(--y);border-color:#16161a;box-shadow:3px 3px 0 var(--p);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bar{height:14px;border:2px solid #16161a;background:#fff;margin-top:12px}.bar i{display:block;height:100%;width:0;background:var(--p)}
.stage{position:relative;height:min(450px,78vh);display:none}
.stage.show{display:block}
.mEnv{position:absolute;left:0;right:0;bottom:0;height:190px;background:var(--kraft);border:3px solid #16161a;box-shadow:6px 6px 0 #16161a}
.flap{position:absolute;left:0;right:0;bottom:190px;height:110px;background:var(--kraft2);clip-path:polygon(0 100%,100% 100%,50% 0);transform-origin:50% 100%;transition:transform .6s,opacity .3s .4s;z-index:3;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:34px;padding-bottom:10px}
.stage.open .flap{transform:rotateX(180deg);opacity:0;pointer-events:none}
.hint{position:absolute;bottom:-34px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.stage.open .hint{display:none}
.paper{position:absolute;left:14px;right:14px;bottom:24px;height:140px;background:var(--card);border:3px solid #16161a;padding:16px;overflow:auto;z-index:2;transition:all .9s .5s ease;opacity:0;color:var(--ink)}
.stage.open .paper{bottom:56px;height:390px;z-index:5;opacity:1}
.paper .to{color:var(--mute);font-size:13px;margin:0 0 8px}
.paper .tx{white-space:pre-wrap;word-break:break-word;margin:0}
.paper .fr{text-align:right;margin-top:14px;font-family:"Permanent Marker","Kanit";color:var(--p);font-size:18px}
.x{position:absolute;top:-16px;right:-8px;z-index:9;padding:4px 12px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:13px}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(var(--wall) 1.5px,transparent 1.5px);background-size:18px 18px;display:flex;align-items:center;justify-content:center;padding:20px}
#intro.hide{display:none}
.introBox{width:min(340px,100%);background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px;text-align:center;transform:rotate(-1.5deg)}
.introBox .big{font-family:"Permanent Marker","Kanit",cursive;font-size:48px;line-height:1;text-shadow:4px 4px 0 var(--y);margin-bottom:10px}
.introBox p{margin:0 0 14px;color:var(--mute)}
.introBox button{width:100%}
#join{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#jbar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--y);opacity:.6;pointer-events:none}
#join span{position:relative}
</style>
</head>
<body>

<div id="intro">
  <div class="introBox">
    <div class="big">STREET<br>MAIL</div>
    <p>มีซองรออยู่ในห้องลับ 💌</p>
    <input id="room" maxlength="40" placeholder="รหัสห้อง (สองคนใส่ให้ตรงกัน)">
    <button id="join" type="button"><i id="jbar"></i><span id="jl">กดค้างไว้ 2 วิ เพื่อปลดล็อกประตู 🔒</span></button>
    <div class="note" id="introNote"></div>
  </div>
</div>

<main>
  <h1>STREET MAIL</h1>
  <p class="sub">เขียนหากันวันละฉบับ · ทำภารกิจก่อน ถึงจะได้แกะซอง 💌</p>

  <h2>✍️ เขียนวันนี้</h2>
  <div class="box">
    <input id="nick" maxlength="20" placeholder="ชื่อเล่นของเรา (โชว์บนซอง)">
    <textarea id="txt" maxlength="2000" placeholder="วันนี้อยากบอกอะไรเขาดี…"></textarea>
    <div class="lab">🎯 ภารกิจที่เขาต้องทำก่อนเปิดซอง</div>
    <div class="chips" id="chips"></div>
    <input id="misTxt" maxlength="60" placeholder="เขียนภารกิจเอง เช่น ดื่มน้ำ 1 แก้ว" hidden>
    <button id="send">แปะซอง ส่งเลย</button>
    <div class="note" id="sendNote"></div>
  </div>

  <h2>📬 ซองที่ส่งมาถึงเรา</h2>
  <div class="grid" id="inbox"></div>
  <div class="empty" id="inboxEmpty" hidden>ยังไม่มีซองมาถึง รอแป๊บนะ 🌙</div>

  <h2>📮 ที่เราส่งไปแล้ว</h2>
  <div class="box" id="sent"></div>
  <div class="note" id="mode"></div>
</main>

<div id="modal">
  <div class="wrap">
    <button class="x" id="close">ปิด ✕</button>
    <div class="mis" id="mis"></div>
    <div class="stage" id="stage">
      <div class="paper"><p class="to" id="pTo"></p><p class="tx" id="pTx"></p><div class="fr" id="pFr"></div></div>
      <div class="mEnv"></div>
      <div class="flap" id="flap">💗</div>
      <div class="hint">แตะตราประทับเพื่อเปิดซอง</div>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var me="me", letters=[], store=null, mType="none";
  var TYPES=[["none","ไม่มีภารกิจ"],["tap","👆 แตะรัว 15 ที"],["hold","⏱️ กดค้าง 3 วิ"],["line","💬 ชมตัวเอง 1 ประโยค"],["real","🎯 ภารกิจจริง (เขียนเอง)"]];
  var nickKey="street-nick";
  try{var n=localStorage.getItem(nickKey); if(n) $("nick").value=n;}catch(e){}

  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function fmt(k){var p=k.split("-");return Number(p[2])+"/"+Number(p[1])}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function misLabel(m){if(!m||m.type==="none")return "";var t=TYPES.filter(function(x){return x[0]===m.type})[0];return m.type==="real"?"🎯 "+(m.text||"ภารกิจ"):(t?t[1]:"")}

  var chips=$("chips");
  TYPES.forEach(function(t){
    var b=document.createElement("button");b.type="button";b.className="chip"+(t[0]===mType?" on":"");b.textContent=t[1];
    b.onclick=function(){mType=t[0];Array.prototype.forEach.call(chips.children,function(c){c.classList.remove("on")});b.classList.add("on");$("misTxt").hidden=mType!=="real"};
    chips.appendChild(b);
  });

  function render(){
    var inbox=letters.filter(function(l){return l.from!==me}).sort(function(a,b){return b.createdAt-a.createdAt});
    var mine=letters.filter(function(l){return l.from===me}).sort(function(a,b){return b.createdAt-a.createdAt});
    var g=$("inbox"); g.innerHTML="";
    inbox.forEach(function(l){
      var b=document.createElement("button");
      b.className="env "+(l.openedAt?"read":"new");
      var locked=!l.openedAt&&l.mission&&l.mission.type!=="none";
      b.innerHTML='<span class="tape"></span><span class="seal">'+(l.openedAt?"💌 อ่านแล้ว":(locked?"🔒 มีภารกิจ":"💗 แกะเลย"))+'</span><span class="nm">'+esc(l.nick||"ใครสักคน")+" · "+fmt(l.date)+"</span>";
      b.onclick=function(){openLetter(l)};
      g.appendChild(b);
    });
    $("inboxEmpty").hidden=inbox.length>0;
    $("sent").innerHTML=mine.length?mine.map(function(l){var ml=misLabel(l.mission);return '<div class="mine"><span>'+fmt(l.date)+" · "+esc(l.text.slice(0,20))+(l.text.length>20?"…":"")+(ml?" · "+esc(ml):"")+'</span><span>'+(l.openedAt?"อ่านแล้ว 👀":"ยังไม่เปิด 🔒")+'</span></div>'}).join(""):'<div class="empty">ยังไม่ได้ส่งฉบับไหนเลย</div>';
    var did=mine.some(function(l){return l.date===today()});
    $("send").disabled=did;
    $("sendNote").textContent=did?"วันนี้ส่งแล้ว พรุ่งนี้มาเขียนใหม่นะ 🌷":"";
  }

  var cleanup=function(){};
  function showLetter(l){
    $("mis").style.display="none";
    var st=$("stage");st.classList.add("show");st.classList.remove("open");
    $("pTo").textContent="ถึงเธอ · "+fmt(l.date);
    $("pTx").textContent=l.text;
    $("pFr").textContent="— "+(l.nick||"ใครสักคน");
    $("flap").onclick=function(){st.classList.add("open");if(!l.openedAt)store.markOpened(l)};
  }
  function openLetter(l){
    cleanup();$("modal").classList.add("on");$("stage").classList.remove("show","open");
    var m=l.mission, box=$("mis");box.style.display="block";
    if(l.openedAt||!m||m.type==="none"){showLetter(l);return}
    var done=function(){cleanup();showLetter(l)};
    if(m.type==="tap"){
      var c=0;box.innerHTML='<h3>ภารกิจ: แตะรัว!</h3><p>แตะปุ่มให้ครบ 15 ครั้ง</p><button id="mb">แตะๆๆ (0/15)</button>';
      $("mb").onclick=function(){c++;this.textContent="แตะๆๆ ("+c+"/15)";if(c>=15)done()};
    }else if(m.type==="hold"){
      box.innerHTML='<h3>ภารกิจ: ใจเย็น</h3><p>กดปุ่มค้างไว้ 3 วินาที</p><button id="mb">กดค้างไว้</button><div class="bar"><i id="bi"></i></div>';
      var t0=0,iv=null,mb=$("mb");
      var stop=function(){clearInterval(iv);iv=null;$("bi").style.width="0"};
      mb.addEventListener("pointerdown",function(e){e.preventDefault();t0=Date.now();iv=setInterval(function(){var p=(Date.now()-t0)/3000;$("bi").style.width=Math.min(100,p*100)+"%";if(p>=1){stop();done()}},40)});
      ["pointerup","pointerleave","pointercancel"].forEach(function(ev){mb.addEventListener(ev,stop)});
      mb.addEventListener("contextmenu",function(e){e.preventDefault()});
      cleanup=function(){clearInterval(iv)};
    }else if(m.type==="line"){
      box.innerHTML='<h3>ภารกิจ: ชมตัวเอง</h3><p>พิมพ์คำชมตัวเอง 1 ประโยค (อย่างน้อย 5 ตัวอักษร)</p><input id="mi" placeholder="วันนี้เราเก่งมากเพราะ…"><button id="mb">ผ่าน!</button>';
      $("mb").onclick=function(){if($("mi").value.trim().length>=5)done();else $("mi").focus()};
    }else{
      box.innerHTML='<h3>ภารกิจ</h3><p>'+esc(m.text||"ทำภารกิจเล็กๆ ที่เขาตั้งไว้")+'</p><button id="mb">ทำแล้ว สัญญาว่าจริง</button>';
      $("mb").onclick=done;
    }
  }
  $("close").onclick=function(){cleanup();$("modal").classList.remove("on")};

  $("send").onclick=function(){
    if(!store)return;
    var t=$("txt").value.trim(), nick=$("nick").value.trim();
    if(!t){$("sendNote").textContent="ยังไม่ได้เขียนอะไรเลยนะ 🥺";return}
    var mt=$("misTxt").value.trim();
    if(mType==="real"&&!mt){$("sendNote").textContent="อย่าลืมเขียนภารกิจด้วยนะ 🎯";return}
    try{localStorage.setItem(nickKey,nick)}catch(e){}
    $("send").disabled=true;
    store.add({from:me,nick:nick,text:t,date:today(),createdAt:Date.now(),openedAt:null,mission:{type:mType,text:mType==="real"?mt:""}})
      .then(function(){$("txt").value="";$("misTxt").value=""})
      .catch(function(){$("sendNote").textContent="ส่งไม่สำเร็จ ลองใหม่อีกครั้งนะ";$("send").disabled=false});
  };
  render();

  /* ===== Firebase ===== */
  var firebaseConfig = {
    apiKey: "AIzaSyD6v0uTvEun37VJEv8xeUdu2SBv82xMupU",
    authDomain: "littlemeen-2e28d.firebaseapp.com",
    projectId: "littlemeen-2e28d",
    storageBucket: "littlemeen-2e28d.firebasestorage.app",
    messagingSenderId: "279409829772",
    appId: "1:279409829772:web:3ab84e8af35b75809658a9",
    measurementId: "G-XHQEB42SL7"
  };
  firebase.initializeApp(firebaseConfig);

  var myId;
  try{
    myId=localStorage.getItem("street-me");
    if(!myId){myId="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("street-me",myId)}
  }catch(e){myId="u"+Math.random().toString(36).slice(2)}

  var unsub=null;
  function connect(room){
    room=room.toLowerCase().replace(/[^a-z0-9_-]/g,"");
    if(room.length<4){$("introNote").textContent="รหัสห้องต้องมีอย่างน้อย 4 ตัว ใช้ a-z 0-9 - _ เท่านั้น";return false}
    try{localStorage.setItem("street-room",room)}catch(e){}
    var col=firebase.firestore().collection("rooms").doc(room).collection("letters");
    me=myId;
    store={
      add:function(o){return col.add(o)},
      markOpened:function(l){col.doc(l.id).update({openedAt:Date.now()}).catch(function(){})}
    };
    if(unsub)unsub();
    letters=[];render();
    $("mode").textContent="ห้อง: "+room;
    unsub=col.orderBy("createdAt","desc").limit(200).onSnapshot(function(snap){
      letters=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});render();
    },function(){$("mode").textContent="เชื่อมต่อไม่สำเร็จ เช็กค่า firebaseConfig และ Rules อีกครั้ง"});
    return true;
  }
  try{var sr=localStorage.getItem("street-room");if(sr)$("room").value=sr}catch(e){}

  /* ปุ่มกดค้าง 2 วิ เพื่อเข้าห้อง */
  var jt=null,j0=0,jb=$("join");
  function jstop(){
    clearInterval(jt);jt=null;
    $("jbar").style.width="0";
    $("jl").textContent="กดค้างไว้ 2 วิ เพื่อปลดล็อกประตู 🔒";
  }
  jb.addEventListener("pointerdown",function(e){
    e.preventDefault();
    var r=$("room").value.toLowerCase().replace(/[^a-z0-9_-]/g,"");
    if(r.length<4){$("introNote").textContent="รหัสห้องต้องมีอย่างน้อย 4 ตัว ใช้ a-z 0-9 - _ เท่านั้น";return}
    $("introNote").textContent="";
    $("jl").textContent="กำลังปลดล็อก… 🔓";
    j0=Date.now();
    clearInterval(jt);
    jt=setInterval(function(){
      var p=Math.min(1,(Date.now()-j0)/2000);
      $("jbar").style.width=(p*100)+"%";
      if(p>=1){
        jstop();
        if(connect(r))$("intro").classList.add("hide");
      }
    },40);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){jb.addEventListener(ev,jstop)});
  jb.addEventListener("contextmenu",function(e){e.preventDefault()});
})();
</script>
</body>
</html>
